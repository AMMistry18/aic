name: aic
services:
  eval:
    image: ghcr.io/intrinsic-dev/aic/aic_eval
    # image: my-eval:v1
    build:
      dockerfile: docker/aic_eval/Dockerfile
      context: ..
    command: gazebo_gui:=false launch_rviz:=false ground_truth:=false start_aic_engine:=true shutdown_on_aic_engine_exit:=true model_discovery_timeout_seconds:=600
    gpus: all
    networks:
      - default
    environment:
      AIC_EVAL_PASSWD: CHANGE_IN_PROD
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      # AIC_ENABLE_ACL: true
  model:
    image: my-solution:v8
    # Flowstate runs the policy on Linux/x86_64.  Pin this explicitly so an
    # Apple-Silicon development host builds the deployable image via emulation
    # instead of attempting the unsupported linux-aarch64 Pixi environment.
    platform: linux/amd64
    build:
      dockerfile: docker/aic_model/Dockerfile
      context: ..
    gpus: all
    networks:
      - default
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CHECK_ATTEMPTS: -1
      AIC_ROUTER_ADDR: eval:7447
      AIC_MODEL_PASSWD: CHANGE_IN_PROD
      AIC_SC_POSE_OUTPUT_DIR: /aic_perception_data/pose_sc_gt_raw
      # The policy must choose from all perceived ports and accept any initial
      # handoff distance.  It still keeps force and motion aborts active.
      RL_INSERT_MAX_HANDOFF_SELECT_M: inf
      RL_INSERT_HANDOFF_MAX_DIST: inf
      # AIC_ENABLE_ACL: true
    volumes:
      - /home/ubuntu/aic_perception_data:/aic_perception_data
networks:
  default:
    internal: true
