[workspace]
name = "aic"
authors = ["Teo Koon Peng <koonpeng@intrinsic.ai>"]
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
conda-pypi-map = { "robostack-kilted" = "robostack_mapping.json" }
preview = ["pixi-build"]

[target.linux-64.dependencies]
evdev = ">=1.9.2,<2"
lttng-ust = ">=2.13.9,<3"
yaml-cpp = ">=0.8.0,<0.9"
sophus = ">=1!1.24.6,<1!2"
eigen = ">=3.4.0,<4"
cxx-compiler = ">=1.11.0,<2"
compilers = ">=1.11.0,<2"
gxx_linux-64 = ">=14.3.0,<15"
gcc_linux-64 = ">=14.3.0,<15"

[dependencies]
isort = "==5.13.2"                                                                     # version bundled by the vscode extension
json5 = ">=0.13.0,<0.14"                                                               # version bundled by the vscode extension
numpy = "<2.3.0"
packaging = ">=24.2,<26.0"                                                             # required by lerobot==0.4.3
pyright = "==1.1.408"
ros-kilted-aic-control-interfaces = { path = "aic_interfaces/aic_control_interfaces" }
ros-kilted-aic-example-policies = { path = "aic_example_policies" }
ros-kilted-aic-model = { path = "aic_model" }
ros-kilted-aic-model-interfaces = { path = "aic_interfaces/aic_model_interfaces" }
ros-kilted-aic-task-interfaces = { path = "aic_interfaces/aic_task_interfaces" }
ros-kilted-aic-teleoperation = { path = "aic_utils/aic_teleoperation" }
# ros-kilted-aic-training-interfaces = { path = "aic_utils/aic_training_interfaces" }
ros-kilted-control-msgs = "*"                                                          # lerobot_robot_ros
ros-kilted-geometry-msgs = "*"                                                         # lerobot_robot_ros
ros-kilted-lerobot-robot-aic = { path = "aic_utils/lerobot_robot_aic" }
ros-kilted-moveit-msgs = "*"                                                           # lerobot_robot_ros
ros-kilted-rclpy = "*"
ros-kilted-rmw-zenoh-cpp = "*"
ros-kilted-ros-core = "*"
ros-kilted-sensor-msgs = "*"                                                           # lerobot_robot_ros
ros-kilted-std-msgs = "*"                                                              # lerobot_robot_ros
ros-kilted-std-srvs = "*"
ros-kilted-tf2-ros-py = "*"
setuptools = ">=71.0.0,<81.0.0"                                                        # required by lerobot==0.4.3
ros-kilted-gz-cmake-vendor = ">=0.3.3,<0.4"
ros-kilted-gz-plugin-vendor = ">=0.2.3,<0.3"
ros-kilted-gz-common-vendor = ">=0.2.7,<0.3"
ros-kilted-gz-msgs-vendor = ">=0.2.4,<0.3"
ros-kilted-gz-sim-vendor = ">=0.2.3,<0.3"
ros-kilted-ros-gz-sim = ">=2.1.15,<3"
ros-kilted-ros-gz-bridge = ">=2.1.15,<3"
ros-kilted-controller-manager = ">=5.12.0,<6"
ros-kilted-robot-state-publisher = ">=3.4.3,<4"
ros-kilted-rviz2 = ">=15.0.12,<16"
ros-kilted-topic-tools = ">=1.4.2,<2"
ros-kilted-xacro = ">=2.1.1,<3"
ros-kilted-kinematics-interface-kdl = ">=2.4.0,<3"
ros-kilted-rosbag2-cpp = ">=0.32.0,<0.33"
ros-kilted-rosbag2-storage-default-plugins = ">=0.32.0,<0.33"
ros-kilted-rosbag2-transport = ">=0.32.0,<0.33"
ros-kilted-tf2-eigen = ">=0.41.6,<0.42"
ros-kilted-tf2-geometry-msgs = ">=0.41.6,<0.42"
ros-kilted-control-toolbox = ">=5.8.3,<6"
ros-kilted-hardware-interface = ">=5.12.0,<6"
ros-kilted-controller-interface = ">=5.12.0,<6"
ros-kilted-realtime-tools = ">=4.7.1,<5"
ros-kilted-ur-description = ">=4.3.0,<5"
ros-kilted-ur-controllers = ">=4.5.0,<5"
ros-kilted-ur-moveit-config = ">=4.5.0,<5"
ros-kilted-ur-robot-driver = ">=4.5.0,<5"

[pypi-dependencies]
huggingface-hub = { version = "~=1.7" }
lerobot = "==0.5.1"
lerobot_robot_ros = { git = "https://github.com/koonpeng/lerobot-ros", rev = "87708d0ae14a724bca78f8ae9d55448332509a57", subdirectory = "lerobot_robot_ros" }
lerobot_teleoperator_devices = { git = "https://github.com/koonpeng/lerobot-ros", rev = "87708d0ae14a724bca78f8ae9d55448332509a57", subdirectory = "lerobot_teleoperator_devices" }
# Classic MuJoCo (CPU) is the sim backend for the Gazebo->MuJoCo pipeline and RL.
# We run classic MuJoCo only — no mjx / no JAX (dropped the GPU-MJX path).
# The scene is loaded from aic_utils/aic_mujoco/mjcf/scene.xml.
mujoco = ">=3.2,<4"
pynput = ">=1.7.6,<2"
pyspacemouse = ">=2.0.0, <3"
ultralytics = ">=8.4.37, <9"
stable-baselines3 = ">=2.6"
wandb = ">=0.20"


[pypi-options.dependency-overrides]
# RTX 5090 (sm_120) needs PyTorch 2.8.0+ with CUDA 12.8+ kernels
# (cu128 wheels first shipped in torch 2.8.0; cu126 lacks sm_120 kernels)
torch = ">=2.8.0"
torchvision = ">=0.23.0"

[activation]
scripts = ["pixi_env_setup.sh"]
