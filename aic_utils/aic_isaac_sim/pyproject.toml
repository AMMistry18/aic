[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-isaac-sim"
version = "0.1.0"
description = "Isaac Lab port of AIC last-inch SFP insertion"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["aic_isaac_sim*"]

[tool.setuptools.package-data]
aic_isaac_sim = ["agents/*.yaml"]
